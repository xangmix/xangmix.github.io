<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" role="img" aria-label="AWR 한 바퀴">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202b"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6672"/></marker></defs>
<rect x="0" y="0" width="960" height="360" rx="14" fill="#ffffff"/>
<text x="20" y="36" font-size="17" text-anchor="start" font-weight="700" fill="#17202b">AWR 한 바퀴: 회귀 두 번 (논문 Algorithm 1)</text><rect x="20" y="70" width="230" height="90" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="2"/><text x="135.0" y="99.25" font-size="15" text-anchor="middle" font-weight="700" fill="#17202b">모아 둔 데이터 D</text><text x="135.0" y="120.25" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6672">사람 시연 · 게임 · 과거 판</text><text x="135.0" y="141.25" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6672">(정책이 직접 굴릴 필요 없음)</text><rect x="300" y="60" width="280" height="60" rx="10" fill="#fbe7f0" stroke="#be185d" stroke-width="2"/><text x="440.0" y="84.75" font-size="15" text-anchor="middle" font-weight="700" fill="#17202b">① V 회귀</text><text x="440.0" y="105.75" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6672">V(s)를 return에 MSE로 맞춤 (= 평균)</text><rect x="300" y="140" width="280" height="60" rx="10" fill="#fcebe1" stroke="#c2410c" stroke-width="2"/><text x="440.0" y="164.75" font-size="15" text-anchor="middle" font-weight="700" fill="#17202b">Â = R − V(s)</text><text x="440.0" y="185.75" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6672">평균보다 얼마나 좋았나</text><rect x="630" y="60" width="310" height="60" rx="10" fill="#fcebe1" stroke="#c2410c" stroke-width="2"/><text x="785.0" y="84.75" font-size="15" text-anchor="middle" font-weight="700" fill="#17202b">가중치 w = exp(Â / β)</text><text x="785.0" y="105.75" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6672">β = 0.05, 최대 20(ω_max)에서 자름</text><rect x="630" y="140" width="310" height="60" rx="10" fill="#e8eafb" stroke="#3b4cca" stroke-width="2"/><text x="785.0" y="164.75" font-size="15" text-anchor="middle" font-weight="700" fill="#17202b">② 가중 BC</text><text x="785.0" y="185.75" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6672">w × (데이터 행동 따라 하기 손실)</text><line x1="252" y1="100" x2="298" y2="90" stroke="#17202b" stroke-width="2" marker-end="url(#ah)"/><line x1="440" y1="122" x2="440" y2="138" stroke="#17202b" stroke-width="2" marker-end="url(#ah)"/><line x1="582" y1="170" x2="626" y2="100" stroke="#17202b" stroke-width="2" marker-end="url(#ah)"/><line x1="785" y1="122" x2="785" y2="138" stroke="#17202b" stroke-width="2" marker-end="url(#ah)"/><rect x="630" y="230" width="310" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="785.0" y="250.75" font-size="15" text-anchor="middle" font-weight="700" fill="#17202b">새 정책</text><text x="785.0" y="271.75" font-size="13" text-anchor="middle" font-weight="400" fill="#5b6672">좋았던 행동일수록 더 따라 함</text><line x1="785" y1="202" x2="785" y2="228" stroke="#17202b" stroke-width="2" marker-end="url(#ah)"/><path d="M630 256 L135 256 L135 162" fill="none" stroke="#5b6672" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ahm)"/><text x="380" y="248" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6672">(선택) 새 정책으로 굴린 판을 D에 추가하고 반복</text><text x="20" y="320" font-size="14" text-anchor="start" font-weight="400" fill="#17202b">· β가 작을수록 좋은 데이터만 골라 따라 하고, β → ∞이면 모든 w = 1이 되어 그냥 BC와 같아요.</text><text x="20" y="344" font-size="14" text-anchor="start" font-weight="400" fill="#17202b">· 정책 학습이 &#x27;BC + 가중치&#x27;라서 PPO·GRPO의 확률비(r)가 필요 없어요.</text>
</svg>
