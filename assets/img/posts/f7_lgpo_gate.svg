<text x="20" y="36" font-size="17" text-anchor="start" font-weight="700" fill="#17202b">LGPO 게이트: 판마다 확신도를 보고 이번 업데이트에 넣을지 정한다</text><rect x="726.8293438122106" y="70" width="163.1706561877894" height="270" fill="#fcebe1"/><text x="808.4146719061052" y="88" font-size="13" text-anchor="middle" font-weight="700" fill="#c2410c">게이트 닫힘</text><text x="808.4146719061052" y="106" font-size="12" text-anchor="middle" font-weight="400" fill="#c2410c">(계수 0)</text><path d="M70.0 183.39999999999998 L890.0 183.39999999999998" fill="none" stroke="#c9d1d8" stroke-width="1.5"/><path d="M70.0 70 L70.0 340" fill="none" stroke="#c9d1d8" stroke-width="1.5"/><text x="70.0" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6672">0.3</text><text x="304.28571428571433" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6672">0.5</text><text x="538.5714285714286" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6672">0.7</text><text x="772.857142857143" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6672">0.9</text><text x="890.0" y="360" font-size="12" text-anchor="middle" font-weight="400" fill="#5b6672">1</text><text x="726.8293438122106" y="360" font-size="12" text-anchor="middle" font-weight="700" fill="#c2410c">0.86</text><path d="M726.8293438122106 70 L726.8293438122106 340" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="890.0" y="380" font-size="12" text-anchor="end" font-weight="400" fill="#5b6672">가로축: 판의 확신도 = 프레임 확률들의 기하평균 e^ℓ̄</text><text x="62.0" y="151.80909090909088" font-size="11" text-anchor="end" font-weight="400" fill="#5b6672">+0.58</text><text x="62.0" y="293.55909090909086" font-size="11" text-anchor="end" font-weight="400" fill="#5b6672">-1.73</text><text x="62.0" y="187.39999999999998" font-size="11" text-anchor="end" font-weight="400" fill="#5b6672">0</text><text x="76.0" y="84" font-size="12" text-anchor="start" font-weight="400" fill="#5b6672">세로축: ∇logπ에 곱해지는 계수</text><path d="M70.0 147.80909090909088 L726.8293438122106 147.80909090909088" fill="none" stroke="#3b4cca" stroke-width="3"/><path d="M726.8293438122106 147.80909090909088 L726.8293438122106 183.39999999999998" fill="none" stroke="#5b6672" stroke-width="1.2" stroke-dasharray="6 5"/><text x="93.42857142857144" y="139.80909090909088" font-size="12" text-anchor="start" font-weight="600" fill="#3b4cca">성공 판 줄 (Â = +0.58)</text><path d="M70.0 289.55909090909086 L726.8293438122106 289.55909090909086" fill="none" stroke="#3b4cca" stroke-width="3"/><path d="M726.8293438122106 289.55909090909086 L726.8293438122106 183.39999999999998" fill="none" stroke="#5b6672" stroke-width="1.2" stroke-dasharray="6 5"/><text x="93.42857142857144" y="281.55909090909086" font-size="12" text-anchor="start" font-weight="600" fill="#3b4cca">실패 판 줄 (Â = −1.73)</text><path d="M726.8293438122106 183.39999999999998 L890.0 183.39999999999998" fill="none" stroke="#b91c1c" stroke-width="3"/><circle cx="538.5714285714286" cy="147.80909090909088" r="7" fill="#15803d" stroke="#fff" stroke-width="2"/><text x="538.5714285714286" y="135.80909090909088" font-size="12" text-anchor="middle" font-weight="700" fill="#15803d">판1 (성공, 0.70): 반영</text><circle cx="796.2857142857144" cy="183.39999999999998" r="7" fill="#b91c1c" stroke="#fff" stroke-width="2"/><text x="786.2857142857144" y="171.39999999999998" font-size="12" text-anchor="end" font-weight="700" fill="#b91c1c">판2 (성공, 0.92): 제외</text><circle cx="655.7142857142858" cy="289.55909090909086" r="7" fill="#15803d" stroke="#fff" stroke-width="2"/><text x="655.7142857142858" y="311.55909090909086" font-size="12" text-anchor="middle" font-weight="700" fill="#15803d">판3 (실패, 0.80): 반영</text><circle cx="831.4285714285713" cy="183.39999999999998" r="7" fill="#b91c1c" stroke="#fff" stroke-width="2"/><text x="821.4285714285713" y="207.39999999999998" font-size="12" text-anchor="end" font-weight="700" fill="#b91c1c">판4 (실패, 0.95): 제외</text><text x="20" y="414" font-size="13" text-anchor="start" font-weight="400" fill="#5b6672">점 하나 = 판 하나. 절벽 위치(0.86)는 늘 같고, 줄의 높이는 그 판의 Â예요. 제외는 성공/실패가 아니라 &#x27;확신이 너무 높음&#x27; 때문이에요.</text>
